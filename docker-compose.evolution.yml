# Evolution API (WhatsApp) para o Prospecta Local.
# Uso: troque TROQUE-ESTA-CHAVE, rode `docker compose -f docker-compose.evolution.yml up -d`
# e abra http://localhost:8080/manager para criar a instância e ler o QR code.
services:
  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUTHENTICATION_API_KEY: TROQUE-ESTA-CHAVE
      SERVER_URL: http://localhost:8080
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_db:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
volumes:
  evolution_instances:
  evolution_db:
